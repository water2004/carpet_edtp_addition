name: Release

on:
  push:
    tags:
      - 'v*-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.metadata.outputs.artifact }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and notes
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          archive_name=$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r')
          expected_tag="v${mod_version}-${minecraft_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag must match gradle.properties: $expected_tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main"
            exit 1
          fi
          if ! grep -Fxq "# ${mod_version} (Minecraft ${minecraft_version})" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md must contain the matching version heading"
            exit 1
          fi
          echo "artifact=${archive_name}-${mod_version}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build release artifacts
        run: ./gradlew build -x runGameTest

      - name: Run Fabric GameTests
        run: ./gradlew runGameTest

      - name: Upload GameTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gametest-results
          path: build/gametest-results.xml
          if-no-files-found: warn

      - name: Check release artifacts
        env:
          ARTIFACT: ${{ steps.metadata.outputs.artifact }}
        run: |
          test -s "build/libs/${ARTIFACT}.jar"
          test -s "build/libs/${ARTIFACT}-sources.jar"

      - name: Upload release artifacts and notes
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/libs/${{ steps.metadata.outputs.artifact }}.jar
            build/libs/${{ steps.metadata.outputs.artifact }}-sources.jar
            RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download tested artifacts and notes
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          if [[ "$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq '.sha')" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag changed after the build started"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "build/libs/${ARTIFACT}.jar" \
            "build/libs/${ARTIFACT}-sources.jar" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest
